name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: mbstring, intl
        coverage: none

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Download phpDocumentor
      run: curl --fail --location --retry 3 --output "$RUNNER_TEMP/phpDocumentor.phar" https://github.com/phpDocumentor/phpDocumentor/releases/download/v3.10.0/phpDocumentor.phar

    - name: Run tests
      run: vendor/bin/phpunit
      env:
        PHPDOC_PHAR: ${{ runner.temp }}/phpDocumentor.phar

    - name: Run PHPStan
      run: vendor/bin/phpstan analyze src --level 5

    - name: Run PHPCS
      run: vendor/bin/phpcs --standard=PSR12 src
